<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Este site foi desativado.">
  <title>Site desativado</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131a;
      color: #f4f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse at top, #252b3a 0, #10131a 65%);
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid #3b4355;
      border-radius: 1.25rem;
      background: #191e29;
      text-align: center;
      box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 30%);
    }

    .status {
      display: inline-block;
      margin: 0 0 1.5rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid #667085;
      border-radius: 999px;
      color: #d0d5dd;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.1;
    }

    p {
      margin: 1rem 0 0;
      color: #c3cada;
      font-size: 1.1rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <p class="status">Projeto encerrado</p>
    <h1>Este site foi desativado</h1>
    <p>O conteúdo deste projeto não está mais disponível.</p>
  </main>
</body>
</html>
